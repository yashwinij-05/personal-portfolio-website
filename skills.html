<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Skills | PortfolioHub</title><link rel="stylesheet" href="style.css"></head>
<body class="app-bg"><header class="appbar"><a class="brand" href="index.html">Portfolio<span>Hub</span></a><div class="userbar"><span id="navUser"></span><button class="btn btn-sm danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="userSidebar"></aside><main class="content"><div class="page-title"><div><span>SKILLS</span><h1>Manage your skills</h1><p>Add the skills you want employers and clients to see.</p></div><button class="btn primary" onclick="openSkillForm()">+ Add Skill</button></div><form id="skillForm" class="panel hidden form-row"><input type="hidden" id="skillId"><div><label>Skill Name</label><input id="skillName" required placeholder="JavaScript"></div><div><label>Category</label><input id="skillCategory" placeholder="Frontend"></div><div><label>Proficiency (%)</label><input id="skillLevel" type="number" min="1" max="100" value="80" required></div><div class="form-actions"><button class="btn primary">Save</button><button type="button" class="btn ghost" onclick="closeSkillForm()">Cancel</button></div><p id="skillMsg" class="message form-full"></p></form><div id="skillsList" class="manage-grid"></div></main></div><script src="script.js"></script></body></html>
