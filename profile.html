<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile | PortfolioHub</title><link rel="stylesheet" href="style.css"></head>
<body class="app-bg"><header class="appbar"><a class="brand" href="index.html">Portfolio<span>Hub</span></a><div class="userbar"><span id="navUser"></span><button class="btn btn-sm danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="userSidebar"></aside><main class="content"><div class="page-title"><div><span>PROFILE</span><h1>Edit your profile</h1><p>This information appears at the top of your public portfolio.</p></div></div><form id="profileForm" class="panel form-grid"><div class="form-full profile-edit-head"><div class="avatar large" id="profileAvatar">PS</div><div><h2 id="profileHeading">Your Name</h2><p>Profile information</p></div></div><div><label>Full Name</label><input id="profileName" required></div><div><label>Professional Title</label><input id="profileTitle" required></div><div class="form-full"><label>About / Bio</label><textarea id="profileBio" rows="5" required></textarea></div><div><label>Email</label><input id="profileEmail" type="email" readonly></div><div><label>Phone</label><input id="profilePhone" placeholder="+91 98765 43210"></div><div><label>Location</label><input id="profileLocation" placeholder="Andhra Pradesh, India"></div><div><label>Education</label><input id="profileEducation" placeholder="B.Tech CSE"></div><div><label>Profile Photo URL</label><input id="profilePhoto" type="url" placeholder="https://..."></div><div class="form-full"><button class="btn primary" type="submit">Save Profile</button><span id="profileMsg" class="message inline"></span></div></form></main></div><script src="script.js"></script></body></html>
