<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Blogs | PortfolioHub</title><link rel="stylesheet" href="style.css"></head>
<body class="app-bg"><header class="appbar"><a class="brand" href="index.html">Portfolio<span>Hub</span></a><div class="userbar"><span id="navUser"></span><button class="btn btn-sm danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="userSidebar"></aside><main class="content"><div class="page-title"><div><span>BLOGS</span><h1>Manage your blogs</h1><p>Share what you learn and build your professional presence.</p></div><button class="btn primary" onclick="openBlogForm()">+ Write Blog</button></div><form id="blogForm" class="panel hidden form-grid"><input type="hidden" id="blogId"><div class="form-full"><label>Blog Title</label><input id="blogTitle" required placeholder="My Journey into Web Development"></div><div><label>Category</label><input id="blogCategory" placeholder="Technology"></div><div><label>Read Time</label><input id="blogTime" placeholder="5 min read"></div><div class="form-full"><label>Content</label><textarea id="blogContent" rows="7" required placeholder="Write your article..."></textarea></div><div class="form-full form-actions"><button class="btn primary">Save Blog</button><button type="button" class="btn ghost" onclick="closeBlogForm()">Cancel</button></div><p id="blogMsg" class="message form-full"></p></form><div id="blogsList" class="manage-grid"></div></main></div><script src="script.js"></script></body></html>
