<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Projects | PortfolioHub</title><link rel="stylesheet" href="style.css"></head>
<body class="app-bg"><header class="appbar"><a class="brand" href="index.html">Portfolio<span>Hub</span></a><div class="userbar"><span id="navUser"></span><button class="btn btn-sm danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="userSidebar"></aside><main class="content"><div class="page-title"><div><span>PROJECTS</span><h1>Manage your projects</h1><p>Add the work you are proud of.</p></div><button class="btn primary" onclick="openProjectForm()">+ Add Project</button></div><form id="projectForm" class="panel hidden form-grid"><input type="hidden" id="projectId"><div><label>Project Title</label><input id="projectTitle" required placeholder="Portfolio Website"></div><div><label>Technologies</label><input id="projectTech" required placeholder="HTML, CSS, JavaScript"></div><div class="form-full"><label>Project Description</label><textarea id="projectDesc" rows="4" required></textarea></div><div><label>Project Image URL</label><input id="projectImage" type="url" placeholder="https://..."></div><div><label>Live Demo URL</label><input id="projectLive" type="url" placeholder="https://..."></div><div><label>GitHub URL</label><input id="projectGithub" type="url" placeholder="https://github.com/..."></div><div class="form-full form-actions"><button class="btn primary">Save Project</button><button type="button" class="btn ghost" onclick="closeProjectForm()">Cancel</button></div><p id="projectMsg" class="message form-full"></p></form><div id="projectsList" class="manage-grid project-manage"></div></main></div><script src="script.js"></script></body></html>
